    <!-- Application Logic -->
    <script>
        // Text conversion functions
        const TextConverter = {
            uppercase: (text) => text.toUpperCase(),
            lowercase: (text) => text.toLowerCase(),
            titleCase: (text) => text.replace(/\w\S*/g, (txt) => 
                txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()),
            camelCase: (text) => HelperUtils.toCamelCase(text),
            snakeCase: (text) => HelperUtils.toSnakeCase(text),
            kebabCase: (text) => HelperUtils.toKebabCase(text),
            reverseText: (text) => text.split('').reverse().join(''),
            removeSpaces: (text) => text.replace(/\s+/g, ''),
            removeLineBreaks: (text) => text.replace(/\n+/g, ' '),
            capitalizeWords: (text) => text.replace(/\b\w/g, (char) => char.toUpperCase()),
            alternatingCase: (text) => text.split('').map((char, i) => 
                i % 2 === 0 ? char.toLowerCase() : char.toUpperCase()).join(''),
            sentenceCase: (text) => text.charAt(0).toUpperCase() + text.slice(1).toLowerCase()
        };

        // Text statistics functions
        const TextStats = {
            getStats: (text) => {
                const words = text.trim().split(/\s+/).filter(word => word.length > 0);
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
                
                return {
                    characters: text.length,
                    charactersNoSpaces: text.replace(/\s/g, '').length,
                    words: words.length,
                    sentences: sentences.length,
                    paragraphs: paragraphs.length,
                    averageWordsPerSentence: sentences.length > 0 ? Math.round(words.length / sentences.length * 100) / 100 : 0,
                    readingTime: Math.ceil(words.length / 200) // 200 words per minute average
                };
            }
        };

        // Component configurations
        window.headerConfig = {
            title: 'Text Case Converter',
            subtitle: 'Convert text to any case format',
            logo: `<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>`,
            navigationItems: [],
            showDarkModeToggle: true
        };

        window.footerConfig = {
            content: 'Made with ❤️ for text processing enthusiasts.',
            subContent: 'All conversions happen locally in your browser. Your privacy is protected.',
            links: []
        };

        // Current conversion mode
        let currentMode = 'uppercase';

        // Initialize components when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading overlay
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 300);
                }, 500);
            }

            // Initialize components
            const header = new Header(window.headerConfig);
            const footer = new Footer(window.footerConfig);
            const toast = new Toast({ position: 'bottom-center', duration: 3000 });
            
            // Initialize Tool Template
            const toolTemplate = new ToolTemplate({
                title: 'Text Case Converter',
                description: 'Convert your text to uppercase, lowercase, title case, camel case, snake case, and more. Perfect for developers, writers, and anyone working with text formatting.',
                features: [
                    'Uppercase & Lowercase',
                    'Title & Sentence Case', 
                    'Camel & Snake Case',
                    'Text Statistics',
                    'Copy & Download',
                    'Works Offline'
                ],
                inputSection: {
                    type: 'textarea',
                    title: 'Input Text',
                    label: 'Enter your text here',
                    placeholder: 'Type or paste your text here to convert...',
                    processButtonText: 'Convert Text',
                    rows: 8
                },
                outputSection: {
                    title: 'Converted Text',
                    placeholder: 'Your converted text will appear here...'
                },
                showPreview: false,
                
                // Add custom conversion mode selector
                customSections: [{
                    html: `
                        <section class="mb-8">
                            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                                <div class="p-6 sm:p-8">
                                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Conversion Mode</h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                                        <button onclick="setConversionMode('uppercase')" class="conversion-mode-btn bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-4 py-2 rounded-lg font-medium hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors duration-200" data-mode="uppercase">
                                            UPPERCASE
                                        </button>
                                        <button onclick="setConversionMode('lowercase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="lowercase">
                                            lowercase
                                        </button>
                                        <button onclick="setConversionMode('titleCase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="titleCase">
                                            Title Case
                                        </button>
                                        <button onclick="setConversionMode('camelCase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="camelCase">
                                            camelCase
                                        </button>
                                        <button onclick="setConversionMode('snakeCase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="snakeCase">
                                            snake_case
                                        </button>
                                        <button onclick="setConversionMode('kebabCase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="kebabCase">
                                            kebab-case
                                        </button>
                                        <button onclick="setConversionMode('reverseText')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="reverseText">
                                            txet esreveR
                                        </button>
                                        <button onclick="setConversionMode('alternatingCase')" class="conversion-mode-btn bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200" data-mode="alternatingCase">
                                            aLtErNaTiNg
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>
                    `
                }],
                
                // Custom processing function
                onProcess: async function(input) {
                    if (!input.trim()) {
                        throw new Error('Please enter some text to convert');
                    }
                    
                    // Show processing for demonstration
                    await HelperUtils.sleep(100);
                    
                    // Convert text based on selected mode
                    const converted = TextConverter[currentMode](input);
                    
                    // Update statistics
                    updateTextStatistics(input, converted);
                    
                    return converted;
                },
                
                // Custom clear function
                onClear: function() {
                    clearTextStatistics();
                    if (window.Toast) {
                        window.Toast.success('Text cleared successfully!');
                    }
                },
                
                // Custom download function
                onDownload: function(output) {
                    const filename = `converted-text-${new Date().toISOString().slice(0, 10)}.txt`;
                    FileUtils.downloadAsFile(output, filename, 'text/plain');
                    if (window.Toast) {
                        window.Toast.success('Text file downloaded successfully!');
                    }
                }
            });

            // Add text statistics section after the tool is initialized
            addTextStatisticsSection();
        });

        // Set conversion mode
        function setConversionMode(mode) {
            currentMode = mode;
            
            // Update button states
            document.querySelectorAll('.conversion-mode-btn').forEach(btn => {
                btn.classList.remove('bg-blue-100', 'dark:bg-blue-900', 'text-blue-800', 'dark:text-blue-200');
                btn.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-gray-200');
            });
            
            const activeBtn = document.querySelector(`[data-mode="${mode}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-gray-200');
                activeBtn.classList.add('bg-blue-100', 'dark:bg-blue-900', 'text-blue-800', 'dark:text-blue-200');
            }
            
            // Auto-convert if there's text
            const inputText = document.getElementById('inputText');
            if (inputText && inputText.value.trim()) {
                const processBtn = document.getElementById('processBtn');
                if (processBtn) {
                    processBtn.click();
                }
            }
        }

        // Add text statistics section
        function addTextStatisticsSection() {
            const outputSection = document.getElementById('outputSection');
            if (outputSection) {
                const statsHTML = `
                    <div id="textStatsSection" class="mt-8 hidden">
                        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                            <div class="p-6 sm:p-8">
                                <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Text Statistics</h3>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div class="text-center p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="charCount">0</div>
                                        <div class="text-sm text-gray-600 dark:text-gray-400">Characters</div>
                                    </div>
                                    <div class="text-center p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div class="text-2xl font-bold text-green-600 dark:text-green-400" id="wordCount">0</div>
                                        <div class="text-sm text-gray-600 dark:text-gray-400">Words</div>
                                    </div>
                                    <div class="text-center p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div class="text-2xl font-bold text-purple-600 dark:text-purple-400" id="sentenceCount">0</div>
                                        <div class="text-sm text-gray-600 dark:text-gray-400">Sentences</div>
                                    </div>
                                    <div class="text-center p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div class="text-2xl font-bold text-orange-600 dark:text-orange-400" id="readingTime">0</div>
                                        <div class="text-sm text-gray-600 dark:text-gray-400">Min Read</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                outputSection.insertAdjacentHTML('afterend', statsHTML);
            }
        }

        // Update text statistics
        function updateTextStatistics(originalText, convertedText) {
            const stats = TextStats.getStats(originalText);
            
            document.getElementById('charCount').textContent = stats.characters.toLocaleString();
            document.getElementById('wordCount').textContent = stats.words.toLocaleString();
            document.getElementById('sentenceCount').textContent = stats.sentences.toLocaleString();
            document.getElementById('readingTime').textContent = stats.readingTime;
            
            const statsSection = document.getElementById('textStatsSection');
            if (statsSection) {
                statsSection.classList.remove('hidden');
                statsSection.classList.add('animate-fade-in');
            }
        }

        // Clear text statistics
        function clearTextStatistics() {
            const statsSection = document.getElementById('textStatsSection');
            if (statsSection) {
                statsSection.classList.add('hidden');
            }
        }

        // Make setConversionMode globally available
        window.setConversionMode = setConversionMode;
    </script>
