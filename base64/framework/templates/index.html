<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags - Will be replaced by SEO config -->
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    <meta name="author" content="{{AUTHOR}}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{{OG_TYPE}}">
    <meta property="og:url" content="{{SITE_URL}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="{{TWITTER_CARD}}">
    <meta property="twitter:url" content="{{SITE_URL}}">
    <meta property="twitter:title" content="{{TWITTER_TITLE}}">
    <meta property="twitter:description" content="{{TWITTER_DESCRIPTION}}">
    <meta property="twitter:image" content="{{TWITTER_IMAGE}}">
    
    <title>{{TITLE}}</title>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "{{APP_NAME}}",
        "description": "{{DESCRIPTION}}",
        "url": "{{SITE_URL}}",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web Browser",
        "permissions": "No special permissions required",
        "softwareVersion": "{{VERSION}}",
        "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "{{RATING_VALUE}}",
            "ratingCount": "{{RATING_COUNT}}",
            "bestRating": "5",
            "worstRating": "1"
        },
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "creator": {
            "@type": "Organization",
            "name": "{{CREATOR_NAME}}",
            "url": "{{CREATOR_URL}}"
        },
        "featureList": {{FEATURE_LIST}}
    }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{FAVICON_SVG}}">
    <link rel="icon" type="image/png" href="{{FAVICON_PNG}}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{APPLE_TOUCH_ICON}}">
    <link rel="manifest" href="{{MANIFEST_PATH}}">
    
    <!-- Styles -->
    <!-- Option 1: Use with Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '{{PRIMARY_50}}',
                            100: '{{PRIMARY_100}}',
                            200: '{{PRIMARY_200}}',
                            300: '{{PRIMARY_300}}',
                            400: '{{PRIMARY_400}}',
                            500: '{{PRIMARY_500}}',
                            600: '{{PRIMARY_600}}',
                            700: '{{PRIMARY_700}}',
                            800: '{{PRIMARY_800}}',
                            900: '{{PRIMARY_900}}'
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Option 2: Use standalone CSS (uncomment if not using Tailwind) -->
    <!--
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/animations.css">
    -->
    
    <!-- Custom Styles -->
    <style>
        /* Import Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom component styles that work with or without Tailwind */
        .drag-over {
            border-color: #60a5fa !important;
            background-color: #eff6ff !important;
        }
        
        .dark .drag-over {
            background-color: rgba(59, 130, 246, 0.1) !important;
        }
        
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #374151;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #6b7280;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    
    <!-- Main Application Container -->
    <div id="app">
        <!-- Header will be inserted here by Header component -->
        
        <!-- Main Content will be inserted here by ToolTemplate component -->
        
        <!-- Footer will be inserted here by Footer component -->
    </div>

    <!-- Toast Container will be inserted here by Toast component -->

    <!-- Loading Overlay (optional) -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white dark:bg-gray-900 z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-600 dark:text-gray-300 font-medium">Loading...</p>
        </div>
    </div>

    <!-- Scripts -->
    
    <!-- Framework Components -->
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../components/toast.js"></script>
    <script src="../components/tool-template.js"></script>
    
    <!-- Framework Utilities -->
    <script src="../utils/file-utils.js"></script>
    <script src="../utils/validation.js"></script>
    <script src="../utils/helpers.js"></script>
    
    <!-- Framework Configuration -->
    <script src="../config/app-config.js"></script>
    <script src="../config/seo-config.js"></script>
    
    <!-- Application Configuration -->
    <script>
        // Configure the application
        const appConfig = getConfig({
            app: {
                name: '{{APP_NAME}}',
                version: '{{VERSION}}',
                description: '{{DESCRIPTION}}',
                author: '{{AUTHOR}}',
                url: '{{SITE_URL}}'
            },
            theme: {
                primaryColor: '{{PRIMARY_COLOR}}',
                secondaryColor: '{{SECONDARY_COLOR}}'
            }
        });

        // Configure SEO
        const seoConfig = new SEOConfig({
            title: '{{TITLE}}',
            description: '{{DESCRIPTION}}',
            keywords: [{{KEYWORDS_ARRAY}}],
            author: '{{AUTHOR}}',
            siteName: '{{SITE_NAME}}',
            siteUrl: '{{SITE_URL}}',
            openGraph: {
                title: '{{OG_TITLE}}',
                description: '{{OG_DESCRIPTION}}',
                image: '{{OG_IMAGE}}',
                url: '{{SITE_URL}}'
            },
            twitter: {
                title: '{{TWITTER_TITLE}}',
                description: '{{TWITTER_DESCRIPTION}}',
                image: '{{TWITTER_IMAGE}}'
            }
        });

        // Apply SEO configuration
        seoConfig.apply();
    </script>
    
    <!-- Application Logic -->
    <script>
        // Configuration for components
        window.headerConfig = {
            title: '{{APP_NAME}}',
            subtitle: '{{APP_SUBTITLE}}',
            logo: '{{HEADER_LOGO}}',
            navigationItems: [
                // Add your navigation items here
                // { text: 'Home', url: '/' },
                // { text: 'About', url: '/about' }
            ],
            showDarkModeToggle: true
        };

        window.footerConfig = {
            content: '{{FOOTER_CONTENT}}',
            subContent: '{{FOOTER_SUB_CONTENT}}',
            links: [
                // Add your footer links here
                // { text: 'Privacy Policy', url: '/privacy' },
                // { text: 'Terms of Service', url: '/terms' }
            ]
        };

        // Initialize components when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading overlay
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 300);
                }, 500);
            }

            // Initialize Header
            const header = new Header(window.headerConfig);
            
            // Initialize Footer
            const footer = new Footer(window.footerConfig);
            
            // Initialize Toast
            const toast = new Toast({
                position: 'bottom-center',
                duration: 3000
            });
            
            // Initialize Tool Template
            const toolTemplate = new ToolTemplate({
                title: '{{TOOL_TITLE}}',
                description: '{{TOOL_DESCRIPTION}}',
                features: [{{TOOL_FEATURES}}],
                inputSection: {
                    type: '{{INPUT_TYPE}}', // 'textarea', 'file', or custom
                    title: '{{INPUT_TITLE}}',
                    label: '{{INPUT_LABEL}}',
                    placeholder: '{{INPUT_PLACEHOLDER}}',
                    processButtonText: '{{PROCESS_BUTTON_TEXT}}'
                },
                outputSection: {
                    title: '{{OUTPUT_TITLE}}',
                    placeholder: '{{OUTPUT_PLACEHOLDER}}'
                },
                showPreview: {{SHOW_PREVIEW}},
                
                // Custom processing function
                onProcess: async function(input) {
                    // Replace this with your actual processing logic
                    {{PROCESS_FUNCTION}}
                    
                    // Example: Echo the input
                    return input;
                },
                
                // Custom clear function
                onClear: function() {
                    if (window.Toast) {
                        window.Toast.success('Cleared successfully!');
                    }
                },
                
                // Custom download function
                onDownload: function(output) {
                    const filename = '{{DOWNLOAD_FILENAME}}';
                    FileUtils.downloadAsFile(output, filename, 'text/plain');
                    if (window.Toast) {
                        window.Toast.success('File downloaded successfully!');
                    }
                }
            });

            // Custom initialization code
            {{CUSTOM_INIT_CODE}}
        });

        // Service Worker Registration (if enabled)
        if ('serviceWorker' in navigator && '{{ENABLE_SW}}' === 'true') {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('{{SW_PATH}}')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Analytics initialization (if configured)
        {{ANALYTICS_CODE}}
    </script>
    
    <!-- Custom Scripts -->
    {{CUSTOM_SCRIPTS}}
</body>
</html>
