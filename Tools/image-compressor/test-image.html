<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Compressor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .test-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        .test-result { margin: 1rem 0; padding: 1rem; background: #f9f9f9; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>Image Compressor v2 Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Basic Functionality</h2>
        <div id="test1-result" class="test-result">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Theme Toggle</h2>
        <button onclick="testThemeToggle()">Test Theme Toggle</button>
        <div id="test2-result" class="test-result">Ready to test</div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: File Input</h2>
        <input type="file" id="testFileInput" accept="image/*" onchange="testFileInput()">
        <div id="test3-result" class="test-result">Select a file to test</div>
    </div>
    
    <div class="test-section">
        <h2>Test 4: Drag & Drop</h2>
        <div id="testDropZone" style="border: 2px dashed #ddd; padding: 2rem; text-align: center; margin: 1rem 0;">
            Drop an image here
        </div>
        <div id="test4-result" class="test-result">Drop an image to test</div>
    </div>
    
    <div class="test-section">
        <h2>Test 5: Canvas Compression</h2>
        <button onclick="testCanvasCompression()">Test Canvas Compression</button>
        <div id="test5-result" class="test-result">Ready to test</div>
    </div>
    
    <script>
        // Test 1: Basic functionality
        function runTest1() {
            try {
                // Test if functions exist
                const requiredFunctions = ['toggleTheme', 'switchTab', 'formatFileSize', 'showNotification'];
                const missingFunctions = requiredFunctions.filter(func => typeof window[func] !== 'function');
                
                if (missingFunctions.length > 0) {
                    throw new Error(`Missing functions: ${missingFunctions.join(', ')}`);
                }
                
                // Test formatFileSize function
                const testSizes = [
                    { bytes: 1024, expected: '1.0 KB' },
                    { bytes: 1048576, expected: '1.0 MB' },
                    { bytes: 0, expected: '0 B' }
                ];
                
                for (const test of testSizes) {
                    const result = formatFileSize(test.bytes);
                    if (result !== test.expected) {
                        throw new Error(`formatFileSize(${test.bytes}) = ${result}, expected ${test.expected}`);
                    }
                }
                
                updateTestResult('test1-result', 'success', 'All basic functionality tests passed!');
                
            } catch (error) {
                updateTestResult('test1-result', 'error', 'Basic functionality test failed: ' + error.message);
            }
        }
        
        // Test 2: Theme toggle
        function testThemeToggle() {
            try {
                const initialTheme = document.body.className;
                toggleTheme();
                const newTheme = document.body.className;
                
                if (initialTheme === newTheme) {
                    throw new Error('Theme did not change');
                }
                
                updateTestResult('test2-result', 'success', `Theme toggled from ${initialTheme} to ${newTheme}`);
                
            } catch (error) {
                updateTestResult('test2-result', 'error', 'Theme toggle test failed: ' + error.message);
            }
        }
        
        // Test 3: File input
        function testFileInput() {
            try {
                const fileInput = document.getElementById('testFileInput');
                const files = fileInput.files;
                
                if (files.length === 0) {
                    updateTestResult('test3-result', 'error', 'No file selected');
                    return;
                }
                
                const file = files[0];
                if (!file.type.startsWith('image/')) {
                    throw new Error('Selected file is not an image');
                }
                
                updateTestResult('test3-result', 'success', `File selected: ${file.name} (${formatFileSize(file.size)})`);
                
            } catch (error) {
                updateTestResult('test3-result', 'error', 'File input test failed: ' + error.message);
            }
        }
        
        // Test 4: Drag & Drop
        function setupDragDrop() {
            const dropZone = document.getElementById('testDropZone');
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.background = '#e3f2fd';
            });
            
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.style.background = '';
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.background = '';
                
                try {
                    const files = Array.from(e.dataTransfer.files);
                    const imageFiles = files.filter(file => file.type.startsWith('image/'));
                    
                    if (imageFiles.length === 0) {
                        throw new Error('No image files dropped');
                    }
                    
                    const file = imageFiles[0];
                    updateTestResult('test4-result', 'success', `Dropped: ${file.name} (${formatFileSize(file.size)})`);
                    
                } catch (error) {
                    updateTestResult('test4-result', 'error', 'Drag & drop test failed: ' + error.message);
                }
            });
        }
        
        // Test 5: Canvas compression
        function testCanvasCompression() {
            try {
                // Create a test canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 100;
                canvas.height = 100;
                
                // Draw a simple test pattern
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(0, 0, 50, 50);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(50, 0, 50, 50);
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(0, 50, 50, 50);
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(50, 50, 50, 50);
                
                // Test toBlob functionality
                canvas.toBlob((blob) => {
                    if (blob) {
                        updateTestResult('test5-result', 'success', `Canvas compression test passed: ${formatFileSize(blob.size)}`);
                    } else {
                        throw new Error('Canvas toBlob failed');
                    }
                }, 'image/jpeg', 0.8);
                
            } catch (error) {
                updateTestResult('test5-result', 'error', 'Canvas compression test failed: ' + error.message);
            }
        }
        
        // Helper function to update test results
        function updateTestResult(elementId, status, message) {
            const element = document.getElementById(elementId);
            element.className = `test-result ${status}`;
            element.textContent = message;
        }
        
        // Initialize tests
        window.addEventListener('load', () => {
            setupDragDrop();
            
            // Wait for main script to load
            setTimeout(() => {
                runTest1();
            }, 1000);
        });
    </script>
    
    <!-- Load the main script -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="script.js"></script>
</body>
</html>
